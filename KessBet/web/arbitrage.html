<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Odds Monitor · 套利命中</title>
<style>
:root{
  --bg:#e9ebee; --panel:#ffffff; --panel2:#f4f5f7; --line:#c9cfd6;
  --fg:#15181c; --dim:#4a525c; --muted:#7a838d;
  --s1:#1f6fd0; --s2:#c2410c; --s3:#0b7a52;
  --good:#0a6e0a; --warning:#8a5a00; --serious:#bc4c00; --critical:#b01818;
  --accent:#1f6fd0;
}
*{box-sizing:border-box}
body{margin:0; background:var(--bg); color:var(--fg);
  font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
a{color:var(--accent); text-decoration:none}

header{position:sticky; top:0; z-index:10; background:var(--panel);
  border-bottom:1px solid var(--line)}
header .inner{max-width:1240px; margin:0 auto; padding:12px 22px 16px}
header .top{display:flex; gap:16px; align-items:center; flex-wrap:wrap}
header h1{font-size:18px; margin:0; font-weight:600; letter-spacing:-.01em}

/* 顶部导航：与列表页、详情页共用同一套，切页面时位置不跳 */
.tabs{display:flex; gap:2px; align-items:center; margin-right:6px}
.tab{
  position:relative; font-size:13px; color:var(--dim); text-decoration:none;
  padding:6px 12px; border-radius:6px; white-space:nowrap;
}
.tab:hover{color:var(--accent); background:rgba(31,111,208,.06)}
.tab.on{color:var(--fg); font-weight:600; background:var(--panel2)}
.tab .dot{
  display:inline-block; min-width:16px; height:16px; margin-left:6px;
  padding:0 4px; border-radius:8px; background:var(--critical); color:#fff;
  font-size:11px; font-weight:600; line-height:16px; text-align:center;
  font-variant-numeric:tabular-nums;
}
/* 上面的 display 会盖掉浏览器默认的 [hidden]{display:none} */
.tab .dot[hidden]{display:none}
header .tabs::after{content:''; width:1px; height:18px;
  background:var(--line); margin-left:8px}

.stats{display:flex; gap:20px; margin-left:auto; font-size:13px; flex-wrap:wrap}
.stats span{color:var(--dim)}
.stats b{font-variant-numeric:tabular-nums; color:var(--fg); font-weight:600}

.wrap{padding:18px 22px 60px; max-width:1240px; margin:0 auto}

/* 空状态：这张表正常情况下就该是空的 */
.empty{background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:48px 24px; text-align:center}
.empty h2{margin:0 0 10px; font-size:16px; font-weight:600; color:var(--good)}
.empty p{margin:6px 0; color:var(--dim); font-size:13px; line-height:1.8}
.empty code{background:var(--panel2); padding:1px 6px; border-radius:3px;
  font-family:ui-monospace,Consolas,monospace; font-size:12px}

table{width:100%; border-collapse:collapse; background:var(--panel);
  border:1px solid var(--line); border-radius:8px; overflow:hidden;
  font-variant-numeric:tabular-nums}
thead th{text-align:left; font-size:11px; font-weight:500; color:var(--dim);
  padding:9px 12px; border-bottom:1px solid var(--line);
  text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;
  background:var(--panel2)}
thead th.num{text-align:right}
tbody td{padding:9px 12px; border-bottom:1px solid rgba(201,207,214,.6);
  font-size:13px}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:rgba(31,111,208,.05); cursor:pointer}
td.num{text-align:right; font-family:ui-monospace,Consolas,monospace}
.cost{font-weight:600; color:var(--good)}
.profit{font-weight:600}
.profit.pos{color:var(--good)}
.profit.neg{color:var(--critical)}
.teams small{display:block; color:var(--dim); font-size:11px; font-weight:400}
.alert-time{color:var(--dim); white-space:nowrap; font-size:12px}

/* 详情抽屉 */
.overlay{position:fixed; inset:0; background:rgba(0,0,0,.35); display:none;
  z-index:50; overflow-y:auto}
.overlay.show{display:block}
.drawer{max-width:1100px; margin:40px auto; background:var(--bg);
  border-radius:10px; padding:0 0 24px; box-shadow:0 8px 32px rgba(0,0,0,.2)}
.drawer-head{position:sticky; top:0; background:var(--panel);
  border-bottom:1px solid var(--line); padding:14px 22px;
  border-radius:10px 10px 0 0; display:flex; gap:14px; align-items:center;
  flex-wrap:wrap; z-index:2}
.drawer-head h2{font-size:16px; margin:0; font-weight:600}
.drawer-head .close{margin-left:auto; background:var(--panel2);
  border:1px solid var(--line); border-radius:5px; padding:5px 12px;
  font-size:13px; cursor:pointer; color:var(--fg)}
.drawer-body{padding:16px 22px 0}

.card{background:var(--panel); border:1px solid var(--line); border-radius:8px;
  padding:14px 16px; margin-bottom:14px}
.card h3{font-size:13px; margin:0 0 12px; font-weight:600; color:var(--accent)}

.kv{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px}
.kv .item .k{font-size:11px; color:var(--dim); margin-bottom:4px}
.kv .item .v{font-size:16px; font-weight:600; font-variant-numeric:tabular-nums}
.kv .item .v.good{color:var(--good)}
.kv .item .v.warn{color:var(--warning)}

.pick{display:inline-flex; gap:8px; align-items:center; background:var(--panel2);
  border:1px solid var(--line); border-radius:6px; padding:7px 11px;
  margin:0 8px 8px 0; font-size:12px}
.pick .v{font-family:ui-monospace,Consolas,monospace; font-weight:600}
.pick .w{color:var(--dim)}

.markets{max-height:520px; overflow-y:auto; border:1px solid var(--line);
  border-radius:6px}
.mk{border-bottom:1px solid rgba(201,207,214,.6)}
.mk:last-child{border-bottom:none}
.mk h4{margin:0; padding:8px 12px; font-size:12px; font-weight:600;
  color:var(--accent); background:var(--panel2); cursor:pointer;
  display:flex; align-items:center; gap:8px}
.mk h4 .n{color:var(--dim); font-weight:400; margin-left:auto; font-size:11px}
.mk table{width:100%; border:none; border-radius:0; background:transparent}
.mk tbody td{padding:5px 12px; font-size:12px;
  border-bottom:1px solid rgba(201,207,214,.35)}
.mk.collapsed tbody{display:none}

.banner{padding:10px 14px; border-radius:6px; font-size:13px; margin-bottom:14px}
.banner.warn{background:rgba(138,90,0,.09); border-left:3px solid var(--warning);
  color:var(--warning)}
.banner.crit{background:rgba(176,24,24,.08); border-left:3px solid var(--critical);
  color:var(--critical)}
</style>
</head>
<body>

<header>
  <div class="inner">
    <div class="top">
      <nav class="tabs">
        <a href="/" class="tab">列表</a>
        <a href="/arbitrage" class="tab on" id="navArb" aria-current="page"
           title="查看套利命中记录（含当时的完整盘口快照）">
          套利命中<span class="dot" id="arbBadge" hidden></span>
        </a>
      </nav>
      <div class="stats">
        <span>命中 <b id="stHits">—</b> 次</span>
        <span>涉及 <b id="stMatches">—</b> 场</span>
        <span>最低成本 <b id="stMin" style="color:var(--good)">—</b></span>
        <span id="stRange" style="font-size:12px"></span>
      </div>
    </div>
  </div>
</header>

<div class="wrap" id="content"></div>

<div class="overlay" id="overlay">
  <div class="drawer">
    <div class="drawer-head">
      <h2 id="dwTitle">—</h2>
      <button class="close" id="dwClose">关闭</button>
    </div>
    <div class="drawer-body" id="dwBody"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// 收益率的正负号必须手写：toFixed 不会带符号，直接拼 '+' 会让负数变成 "+-5.62%"
function pct(v, digits){
  if(v == null) return '—';
  return (v >= 0 ? '+' : '') + v.toFixed(digits) + '%';
}
const pctClass = v => v == null ? '' : (v >= 0 ? 'pos' : 'neg');

async function loadStats(){
  try{
    const s = await (await fetch('/api/arbitrage/stats')).json();
    $('stHits').textContent = s.hits;
    $('stMatches').textContent = s.matches;
    $('stMin').textContent = s.min_cost == null ? '—' : s.min_cost.toFixed(4);
    $('stRange').textContent = s.hits
      ? (s.first_alert || '').slice(5,16) + ' 起'
      : '';
    // 本页就是套利页，导航角标保持与统计头一致（有命中才显示）
    const b = $('arbBadge');
    if (b){
      b.hidden = !s.hits;
      b.textContent = s.hits > 99 ? '99+' : s.hits;
    }
  }catch(e){ $('stRange').textContent = '统计加载失败'; }
}

async function loadList(){
  let d;
  try{
    d = await (await fetch('/api/arbitrage?limit=200')).json();
  }catch(e){
    $('content').innerHTML = `<div class="banner crit">加载失败：${e.message}</div>`;
    return;
  }

  if(!d.hits.length){
    $('content').innerHTML = `
      <div class="empty">
        <h2>✓ 暂无套利命中</h2>
        <p>这是<b>正常</b>状态。单家博彩公司内部出现 <code>Σ(1/赔率) &lt; 1</code>
           只可能是调价错误，正常情况下永远不会出现。</p>
        <p>一旦命中，这里会保存当时那场比赛的<b>完整盘口快照</b>，
           包括全部盘口、全部选项、ILP/LP 双模型结果，<br>
           用于事后复核「当时为什么判定为套利」。</p>
        <p style="margin-top:18px; font-size:12px; color:var(--muted)">
          检测条件：ILP 成本 &lt; 1.0 <b>且</b> LP 最差收益 &gt; 0（两个模型都确认）</p>
      </div>`;
    return;
  }

  $('content').innerHTML = `
    <table>
      <thead><tr>
        <th>告警时间</th><th>开赛</th><th>比赛</th>
        <th class="num">成本</th><th class="num">最差收益</th>
        <th class="num">盘口/选项</th><th>命中组合</th>
      </tr></thead>
      <tbody>${d.hits.map(h => `
        <tr data-id="${h.id}">
          <td class="alert-time">${(h.alert_time||'').slice(5,16)}</td>
          <td class="alert-time">${(h.kickoff_time||'').slice(5,16)}</td>
          <td class="teams">${h.home_team}<small>vs ${h.away_team} · ${h.league||'—'}</small></td>
          <td class="num cost">${h.cost.toFixed(4)}</td>
          <td class="num profit ${pctClass(h.profit_pct)}">${pct(h.profit_pct, 2)}</td>
          <td class="num" style="color:var(--dim)">${h.n_markets}/${h.n_selections}</td>
          <td style="font-size:12px; color:var(--dim)">
            ${h.lp_chosen.map(x => esc(x.text)).join('　·　')}</td>
        </tr>`).join('')}
      </tbody>
    </table>
    <p style="color:var(--dim); font-size:12px; margin-top:10px">
      点击任意一行查看当时的完整盘口快照。共 ${d.total} 条。</p>`;

  document.querySelectorAll('tbody tr[data-id]').forEach(tr => {
    tr.addEventListener('click', () => openDetail(tr.dataset.id));
  });
}

function esc(s){ return String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function openDetail(id){
  $('overlay').classList.add('show');
  $('dwBody').innerHTML = '<p style="color:var(--dim)">加载中…</p>';
  let h;
  try{
    h = await (await fetch('/api/arbitrage/' + id)).json();
  }catch(e){
    $('dwBody').innerHTML = '<div class="banner crit">加载失败</div>';
    return;
  }
  $('dwTitle').textContent = `${h.home_team} vs ${h.away_team}`;

  const warns = [];
  if(h.cross_gap != null && h.cross_gap < -1e-6)
    warns.push('ILP 与 LP 交叉验证未通过（LP 比 ILP 差），结果可能不可靠');
  if(h.lp_worst_profit == null || h.lp_worst_profit <= 0)
    warns.push('LP 最差收益不大于 0，严格来说不构成套利');

  $('dwBody').innerHTML = `
    ${warns.map(w => `<div class="banner crit">⚠ ${w}</div>`).join('')}
    <div class="banner warn">
      这是 <b>${esc(h.alert_time)}</b> 时刻的快照，不是当前赔率。
      赔率之后可能已经变化，下面的数字只代表当时。
    </div>

    <div class="card">
      <h3>判定结果</h3>
      <div class="kv">
        <div class="item"><div class="k">最小覆盖成本</div>
          <div class="v good">${h.cost.toFixed(6)}</div></div>
        <div class="item"><div class="k">LP 最差收益</div>
          <div class="v ${pctClass(h.profit_pct) === 'neg' ? 'warn' : 'good'}">${pct(h.profit_pct, 4)}</div></div>
        <div class="item"><div class="k">盘口 / 选项</div>
          <div class="v">${h.n_markets} / ${h.n_selections}</div></div>
        <div class="item"><div class="k">可建模候选</div>
          <div class="v">${h.n_candidates}</div></div>
        <div class="item"><div class="k">开赛</div>
          <div class="v" style="font-size:14px">${esc(h.kickoff_time)}</div></div>
        <div class="item"><div class="k">赔率版本</div>
          <div class="v" style="font-size:14px; color:var(--dim)">${esc(h.odds_updated)}</div></div>
      </div>
    </div>

    <div class="card">
      <h3>下注方案（LP）</h3>
      ${h.lp_chosen.map(x =>
        `<span class="pick"><span>${esc(x.text)}</span>
         <span class="w">权重</span><span class="v">${(x.weight*100).toFixed(2)}%</span></span>`
      ).join('') || '<span style="color:var(--dim)">无</span>'}
      <div style="clear:both; margin-top:8px; font-size:12px; color:var(--dim)">
        投 1000 元：${h.lp_chosen.map(x =>
          `<b>${esc(x.text)}</b> 买 ${(x.weight*1000).toFixed(2)} 元`).join('，') ||
          '无可下注组合'}
      </div>
    </div>

    <div class="card">
      <h3>ILP 选中组合</h3>
      ${h.ilp_chosen.map(x =>
        `<span class="pick"><span class="v">${esc(x.text)}</span></span>`).join('')
        || '<span style="color:var(--dim)">无</span>'}
    </div>

    <div class="card">
      <h3>当时全部盘口（${h.market_detail.length} 个）</h3>
      <div class="markets" id="mkList">
        ${h.market_detail.map((m, i) => `
          <div class="mk ${i >= 6 ? 'collapsed' : ''}">
            <h4 onclick="this.parentNode.classList.toggle('collapsed')">
              ${esc(m.name)}<span class="n">${m.selections.length} 项</span></h4>
            <table><tbody>
              ${m.selections.map(s => `<tr>
                <td>${esc(s.label)}</td>
                <td style="color:var(--muted)">${esc(s.line || '—')}</td>
                <td style="text-align:right">${s.odds.toFixed(2)}</td>
              </tr>`).join('')}
            </tbody></table>
          </div>`).join('')}
      </div>
      ${h.market_detail.length > 6
        ? '<p style="color:var(--dim); font-size:12px; margin:8px 0 0">点击盘口标题展开/收起</p>'
        : ''}
    </div>`;
}

$('dwClose').addEventListener('click', () => $('overlay').classList.remove('show'));
$('overlay').addEventListener('click', e => {
  if(e.target === $('overlay')) $('overlay').classList.remove('show');
});
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') $('overlay').classList.remove('show');
});

loadStats();
loadList();
</script>
</body>
</html>
